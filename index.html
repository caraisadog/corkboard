<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡片写作台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Noto+Serif+SC:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: top bar, then a felt board; a card opens in place on the board as a two-part editor (card face | manuscript).
   Storage: a project = a local folder; each card = one Markdown file with front matter; project.json keeps order. */
:root{
  --board:#c3cbc4; --board-shade:#b4bdb5;
  --card:#fffef9; --card-edge:#e3e1d6;
  --ink:#1e2326; --muted:#687177;
  --rule-blue:#b7cde0; --tint:20%;
  --accent:#2e5b86; --accent-ink:#ffffff;
  --bar:#f4f5f2; --line:#d7dbd5; --danger:#b42318;
  --s-idea:#9aa3a8; --s-draft:#d39a2c; --s-rev:#3f7fb8; --s-done:#3f8f5a;
  --shadow:0 1px 0 rgba(0,0,0,.06),0 2px 6px rgba(30,40,40,.14);
  --dash:rgba(0,0,0,.18);
  --font-ui:"Instrument Sans",-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
  --font-text:"Noto Serif SC","Songti SC","STSong",serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --board:#1f2628; --board-shade:#1a2022;
  --card:#2b3134; --card-edge:#3a4246;
  --ink:#e6e8e6; --muted:#98a2a7;
  --rule-blue:#3c5266; --tint:30%;
  --accent:#7fb0dc; --accent-ink:#10202e;
  --bar:#171c1e; --line:#30383b; --danger:#ff8a7a;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.35);
  --dash:rgba(255,255,255,.15);
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--board);color:var(--ink);font:14px/1.5 var(--font-ui);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* welcome */
.welcome{flex:1;display:grid;place-items:center;padding:24px}
.wcard{background:var(--card);box-shadow:var(--shadow);border-radius:3px;width:min(460px,100%);padding:0 0 22px}
.wcard h1{margin:0;padding:22px 26px 10px;font-size:22px;border-bottom:1px solid var(--card-edge)}
.wcard .lines{padding:6px 26px 0;font-family:var(--font-text);font-size:14px;line-height:26px;
  background:repeating-linear-gradient(to bottom,transparent 0 25px,var(--rule-blue) 25px 26px);background-position:0 6px}
.wcard .lines p{margin:0}
.wbtns{display:flex;flex-direction:column;gap:8px;padding:18px 26px 0}
.small{font-size:12px;color:var(--muted);padding:10px 26px 0;margin:0}
.warn{color:var(--danger)}

/* top bar */
.bar{background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:nowrap;padding:8px 14px;min-width:0}
.bar>*{flex:none}
.bar .proj{font-weight:700;font-size:16px;border:0;background:transparent;padding:4px 6px;border-radius:4px;flex:0 1 11em;min-width:5em;width:11em;text-overflow:ellipsis}
.proj:hover{background:var(--board-shade)}
.meter{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter .track{width:90px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.meter .fill{height:100%;background:var(--accent)}
.meter input{width:6em;border:0;background:transparent;font-family:var(--font-mono);font-size:12px;color:var(--muted);padding:2px 4px;border-radius:3px}
.meter input:hover{background:var(--board-shade)}
/* save button: always visible; the dot shows the state even when the status text is hidden on narrow windows */
.savebtn{position:relative;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:4px 9px 4px 7px;font-size:13px;cursor:pointer;white-space:nowrap}
.savebtn:hover{background:var(--board-shade)}
@keyframes saveflash{0%{box-shadow:0 0 0 3px color-mix(in srgb,var(--s-done) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.savebtn.flash{animation:saveflash .8s ease-out}
.savebtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}
.savebtn .sdot{width:7px;height:7px;border-radius:50%;background:var(--s-done);flex:none}
.savebtn[data-state="pending"] .sdot{background:var(--s-draft)}
.savebtn[data-state="err"] .sdot{background:var(--danger)}
.savebtn[data-state="err"]{border-color:var(--danger);color:var(--danger)}
.bar .save{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0;max-width:16em}
.save.err{color:var(--danger)}
.spacer{flex:1}
.seg{display:flex;background:var(--board-shade);border-radius:6px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 10px;white-space:nowrap;border-radius:4px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:5px 12px;white-space:nowrap;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{background:var(--board-shade)}

/* project sidebar */
.main{flex:1;min-height:0;display:flex}
/* collapsible sidebars: body.noside hides the project bar, .focus.noface hides the editor's right panel */
.ptoggle{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;border:0;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;padding:0;flex:none}
.ptoggle:hover{background:var(--board-shade);color:var(--ink)}
.ptoggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.ptoggle[aria-pressed="false"]{color:var(--accent)}
body.noside .side{display:none}
.focus.noface .fbody{grid-template-columns:minmax(0,1fr) 0 0}
.focus.noface .fsplit,.focus.noface .face{display:none}
/* 沉浸模式 body.zen: hides the top bar, the editor's toolbar and both sidebars at once, without touching the
   remembered sidebar choices; a small button at the top centre of the window (#peek) brings everything back */
body.zen .bar,body.zen .side,body.zen .ftop,body.zen .mtabs{display:none}
body.zen .fbody{grid-template-columns:minmax(0,1fr) 0 0}
body.zen .fsplit,body.zen .face{display:none}
.peek{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:40;display:none;padding:0 4px;
  background:var(--bar);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;opacity:.55;transition:opacity .15s}
.peek:hover,.peek:focus-within{opacity:1}
body.zen .peek{display:flex}
.peek button{display:inline-flex;align-items:center;justify-content:center;width:34px;height:17px;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0;border-radius:4px}
.peek button:hover{color:var(--ink);background:var(--board-shade)}
.peek svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.side{width:200px;flex:none;background:var(--bar);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:14px 10px;overflow:auto}
.side-h{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);padding:0 8px 4px}
.wtotal{text-align:center;margin:0 8px 10px;padding:8px 10px;border-radius:6px;background:var(--board-shade);font-size:12px;color:var(--muted);line-height:1.5}
.wtotal b{display:block;font-family:var(--font-mono);font-size:15px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.wtoday{padding-top:6px;border-top:1px solid var(--line)}
#wmain:not(:empty)+.wtoday{margin-top:6px}
#wmain:empty+.wtoday{border-top:0;padding-top:0}
.wtoday b{display:inline;font-size:13px;color:var(--accent)}
.wtoday.done b{color:var(--s-done)}
.wtoday .gbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:5px 4px 2px}
.wtoday .gbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.wtoday.done .gbar i{background:var(--s-done)}
.goalbtn{border:0;background:transparent;color:var(--muted);font:inherit;font-size:11.5px;cursor:pointer;padding:1px 4px;border-radius:3px}
.goalbtn:hover{background:var(--card);color:var(--ink)}
.goalin{width:6em;border:1px solid var(--line);background:var(--card);border-radius:4px;font-family:var(--font-mono);font-size:12px;padding:1px 4px;text-align:center}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.pitem{width:100%;display:flex;align-items:center;gap:8px;border:1.5px solid transparent;background:transparent;border-radius:6px;padding:7px 8px;cursor:pointer;text-align:left;font-size:13.5px}
.pitem span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pitem em{font-style:normal;font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pitem:hover{background:var(--board-shade)}
.pitem.on{background:var(--card);box-shadow:var(--shadow);font-weight:600}
.pitem.drop{border-color:var(--accent);background:var(--card)}
.newp input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 8px;font-size:13px}
.side .x{text-align:left}
.stags-h{margin-top:14px}
.stags{display:flex;flex-wrap:wrap;gap:5px;padding:0 6px}
.stags button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:1px 8px;font-size:12px;cursor:pointer;color:var(--ink)}
.stags button em{font-style:normal;color:var(--muted);font-family:var(--font-mono);font-size:10.5px;margin-left:3px}
.stags button:hover{border-color:var(--muted)}
.stags button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stags button[aria-pressed="true"] em{color:inherit}

/* tags + search */
.tag{display:inline-flex;align-items:center;gap:2px;background:var(--board-shade);color:var(--ink);border-radius:9px;padding:0 7px;font-size:11.5px;line-height:18px;white-space:nowrap}
.tag::before{content:"#";color:var(--muted)}
.tag button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 0 0 2px;font-size:12px;line-height:1}
.tag button:hover{color:var(--danger)}
.tagbox{display:flex;flex-wrap:wrap;gap:5px;align-items:center;border-bottom:1px solid var(--card-edge);padding:2px 0 6px}
.face .tagbox input{flex:1;min-width:7em;width:auto;border:0;background:transparent;font-size:13px;font-weight:400;padding:2px 0}
.tagbox input:focus{outline:none}
.card .tags{display:flex;gap:4px;padding:0 14px 2px;overflow:hidden;flex-wrap:nowrap}
.card .tags .tag{cursor:pointer;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.card .tags .tag:hover{background:color-mix(in srgb,var(--ink) 16%,transparent)}
.search{display:flex;align-items:center;gap:6px}
.search input{width:12em;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 9px;font-size:13px}
.search span{font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.gbtn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.gbtn:hover{color:var(--ink)}
.gbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ghead{grid-column:1/-1;margin:10px 0 -8px;font-size:14px;font-weight:600;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.ghead:first-child{margin-top:0}
.ghead span{font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--muted)}
.ghint{grid-column:1/-1;margin:0}
.card.ext{opacity:.92}
.card.ext:hover{opacity:1}
mark{background:color-mix(in srgb,#f5c518 55%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.syn.hit{color:var(--ink);font-style:normal}
.side-tip{font-size:11.5px;color:var(--muted);margin:auto 8px 0;line-height:1.5}
.ftop select#fmove{max-width:11em}

/* stage + board */
.stage{position:relative;flex:1;min-height:0;min-width:0}
.board{position:absolute;inset:0;overflow:auto;padding:24px 16px 64px;
  background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.05),transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,0,0,.04),transparent 45%),var(--board)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;max-width:1280px;margin:0 auto}
.hint{max-width:1280px;margin:0 auto 14px;font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.bbar{max-width:1280px;margin:0 auto 14px;display:flex;align-items:center;gap:14px}
.bbar .hint{margin:0;flex:1;min-width:0}
.sortsel{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--muted);flex:none}
.sortsel svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sortsel select{background:var(--board-shade);color:var(--ink);border:0;border-radius:4px;padding:4px 8px;font-family:var(--font-ui);font-size:12px;cursor:pointer}
.kbd{font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--line);border-radius:3px;padding:0 4px;margin:0 2px}

.card{position:relative;background:var(--card);border-radius:3px;box-shadow:var(--shadow);aspect-ratio:5/3.4;
  display:flex;flex-direction:column;cursor:pointer;user-select:none;transition:transform .15s ease,opacity .2s}
.card:hover{transform:translateY(-2px) rotate(-.3deg)}
.card.is-open{opacity:0}
.card.dragging{opacity:.35}
.pin{position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--pin,var(--accent));box-shadow:0 1px 2px rgba(0,0,0,.35)}
.card h3{margin:0;padding:12px 14px 6px;font-size:14.5px;font-weight:600;border-bottom:1px solid var(--card-edge);text-wrap:balance;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* colour mode "整张": the whole card takes a soft wash of its colour instead of the pin dot */
body.tint .card{background:color-mix(in srgb,var(--pin) var(--tint),var(--card))}
body.tint .card .pin{display:none}
body.tint .card h3{border-bottom-color:color-mix(in srgb,var(--pin) 35%,var(--card-edge))}
.card .syn{flex:1;min-height:0;overflow:hidden;padding:6px 14px 0;font-family:var(--font-text);font-size:13px;line-height:22px;white-space:pre-line}
.card .syn.auto{color:var(--muted);font-style:italic}
/* a picture on the card face: between the title and the text, the text keeps two lines */
.card .cimg{flex:1 1 0;min-height:0;margin:8px 14px 0;border-radius:2px;overflow:hidden;background:var(--board-shade)}
.card .cimg img{display:block;width:100%;height:100%;object-fit:cover}
.card .cimg.only{margin-bottom:4px}
.card.hasimg .syn{flex:none;max-height:50px;padding-top:5px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.cimg.broken,.fthumb.broken{display:flex;align-items:center;justify-content:center}
.cimg.broken img,.fthumb.broken img{display:none}
.cimg.broken::after,.fthumb.broken::after{content:"找不到图片";font-size:11px;color:var(--muted)}
.card footer{display:flex;align-items:center;gap:6px;padding:6px 14px 9px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.card footer .wc{margin-left:auto;font-variant-numeric:tabular-nums}
.add{border:1.5px dashed var(--dash);background:transparent;border-radius:3px;aspect-ratio:5/3.4;color:var(--muted);cursor:pointer;font-size:14px}
.add:hover{color:var(--ink)}

/* focused card */
.veil{position:absolute;inset:0;background:var(--board);opacity:0;pointer-events:none;transition:opacity .3s}
.stage.focusing .veil{opacity:.55;pointer-events:auto}
.focus{position:absolute;top:18px;bottom:18px;left:max(16px,calc(50% - 580px));right:max(16px,calc(50% - 580px));
  background:var(--card);border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.05),0 18px 50px rgba(20,30,30,.28);
  display:flex;flex-direction:column;transform-origin:0 0;overflow:hidden}
.fx{display:flex;flex-direction:column;flex:1;min-height:0;container-type:inline-size}
/* the editor's top bar stays on one row: the file name shrinks (…), then 第 x 张 and "Esc" go when the editor gets narrow */
.ftop>*{flex:none}
.ftop .fname{flex:0 1 auto;min-width:0}
@container (max-width:980px){.ftop #fpos{display:none}}
@container (max-width:860px){.ftop .kesc{display:none}.fx .ftop{gap:9px}}
@container (max-width:760px){.fx .ftop{flex-wrap:wrap}}
.ftop{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;padding:12px 22px 12px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.ftop select{background:var(--board-shade);border:0;border-radius:4px;padding:4px 8px;font-family:var(--font-ui);font-size:12px}
.swatches{display:flex;gap:6px}
.swatches button{width:16px;height:16px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.fname{max-width:16em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.x{border:0;background:transparent;cursor:pointer;font-size:12.5px;color:var(--muted);padding:4px 8px;border-radius:4px}
.x:hover{background:var(--board-shade);color:var(--ink)}
.ftop .first{margin-left:auto}
.ftools{display:flex;align-items:center;gap:2px}
.ftools .ptoggle{margin-right:6px}
.fsz{border:0;background:transparent;color:var(--muted);cursor:pointer;font-family:var(--font-ui);font-size:13px;font-weight:600;padding:3px 6px;border-radius:4px;min-width:28px}
.fsz small{font-size:10px}
.fsz:hover:not(:disabled){background:var(--board-shade);color:var(--ink)}
.fsz:disabled{opacity:.35;cursor:default}
/* pictures of the open card, under the body */
.fimgs{width:100%;max-width:calc(var(--fs,17px)*38);display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.fimgs:empty{display:none}
.fimgs p{flex:0 0 100%;margin:0;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted)}
.fthumb{width:var(--tw,132px);height:calc(var(--tw,132px)*.72);max-width:100%;padding:0;border:1px solid var(--card-edge);border-radius:3px;overflow:hidden;background:var(--board-shade);cursor:zoom-in}
.fthumb img{display:block;width:100%;height:100%;object-fit:cover}
.fthumb:hover{border-color:var(--accent)}
.fimgs p{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tsz{display:flex;gap:2px}
.tsz button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:4px;width:24px;height:20px;padding:0;font-size:13px;line-height:1;cursor:pointer}
.tsz button:hover:not(:disabled){color:var(--ink);border-color:var(--muted)}
.tsz button:disabled{opacity:.35;cursor:default}
/* largest step: each picture takes the whole column at its own shape */
.fimgs[data-size="4"] .fthumb{width:auto;max-width:100%;height:auto;min-width:60px;min-height:40px}
.fimgs[data-size="4"] .fthumb img{width:auto;max-width:100%;height:auto;max-height:75vh;object-fit:contain}
.lbox{position:fixed;inset:0;z-index:60;background:rgba(10,12,14,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;overflow:hidden;touch-action:none;user-select:none}
.lbox[hidden]{display:none}
.lbox img{max-width:100%;max-height:calc(100% - 52px);object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.5);transform-origin:0 0;cursor:zoom-in;will-change:transform}
.lbox.zoomed img{cursor:grab}
.lbox.zoomed img:active{cursor:grabbing}
.lbox .lhint{font-size:10.5px;color:rgba(255,255,255,.45)}
.lclose{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;z-index:1;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.lclose:hover{background:rgba(255,255,255,.22)}
.lbox span{font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.7);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x.armed{color:var(--danger)}
.fbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 9px var(--facew,300px);border-top:1px solid var(--card-edge)}

.fsplit:hover::after,.fsplit.drag::after{opacity:1;background:var(--accent)}
.fsplit:hover::before,.fsplit.drag::before{background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
.face{padding:16px 20px 18px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.face label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted)}

  font-family:var(--font-text);font-size:calc(var(--fs,17px)*.82);line-height:1.85;padding:0;width:100%}
/* synopsis: small, grows with its text up to about a third of the panel; notes take all the remaining height */
/* right panel tabs (like Ulysses): 信息 = title + tags, 梗概, 笔记; each panel gets the full height */
.ftabs{display:flex;justify-content:space-around;border-bottom:1px solid var(--card-edge);margin:-8px -6px 4px;padding:0 0 4px}
.ftabs button{display:flex;align-items:center;justify-content:center;width:34px;height:28px;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0;border-radius:6px;position:relative}
.ftabs button:hover{background:var(--board-shade);color:var(--ink)}
.ftabs button[aria-selected="true"]{color:var(--accent)}
.ftabs svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ftabs .has{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.fpanel{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:10px}
.fpanel textarea{flex:1 1 0;min-height:0;overflow:auto}
.face input:focus,.face textarea:focus,.ms textarea:focus,.sec textarea:focus{outline:none}
.ms{overflow:auto;min-width:0;display:flex;flex-direction:column;align-items:center;padding:28px 32px 80px}
/* the body box grows with its text and must never be squeezed to the column's height (then it would scroll inside itself with no scrollbar) */
.ms>*{flex:none}
.ms textarea{width:100%;max-width:38em;border:0;resize:none;background:transparent;overflow:hidden;
  font-family:var(--font-text);font-size:var(--fs,17px);line-height:1.95;letter-spacing:.01em;min-height:60vh;padding:0}
textarea::placeholder{color:var(--muted);opacity:.7}
/* preview (眼睛按钮 / ⌘E): the body as it reads, pictures where they were inserted; one div per line, like the text box */
#fprevBtn[aria-pressed="false"]{color:var(--muted)}
#fprevBtn[aria-pressed="true"]{color:var(--accent);background:var(--board-shade)}
.focus.preview .fbw,.focus.preview .fimgs{display:none}
/* highlights (==文字==): a copy of the text sits behind the transparent text box, invisible except for the marks */
.fbw{position:relative;width:100%;max-width:38em;font-size:var(--fs,17px)}
.fbw textarea{position:relative;z-index:1}
.fhl{position:absolute;inset:0;pointer-events:none;color:transparent;overflow:hidden;font-family:var(--font-text);font-size:var(--fs,17px);line-height:1.95;letter-spacing:.01em;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal}
.fhl mark,.fread mark{background:color-mix(in srgb,#f5c518 42%,transparent);padding:0;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.fhl mark{color:transparent}
.fhl mark.flash{animation:hlflash 1.4s ease-out}
@keyframes hlflash{0%,35%{background:color-mix(in srgb,#f5c518 90%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,#f5c518 45%,transparent)}}
/* 高亮 tab (after the Roam Inspector dock): gold bar, quote, note under it */
#hlcount{margin-left:4px}
.hlist{flex:1 1 0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:2px}
.hli{border-left:2px solid #ddbb59;padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:4px;position:relative}
.hlq{display:block;margin:0;border:0;background:color-mix(in srgb,#e8cf6a 12%,transparent);color:var(--ink);text-align:left;cursor:pointer;padding:4px 6px;border-radius:3px;font-family:var(--font-text);font-size:calc(var(--fs,17px)*.82);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
button.hlq:hover{background:color-mix(in srgb,#e8cf6a 24%,transparent)}
.face .hlist textarea.hln{flex:none;min-height:1.7em;overflow:hidden;resize:none;border:0;background:transparent;padding:2px 6px;font-size:calc(var(--fs,17px)*.76);line-height:1.6;color:var(--muted)}
.face .hlist textarea.hln:focus{outline:none;color:var(--ink)}
.hlsame{margin:0;padding:0 6px;font-size:11.5px;color:var(--muted);font-style:italic}
.hllost-h{margin:6px 0 -6px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted)}
.hli.lost{border-left-color:var(--card-edge);padding-right:22px}
.hli.lost .hlq{background:transparent;color:var(--muted);text-decoration:line-through;cursor:default}
.hli.lost .lx{position:absolute;top:2px;right:0;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px}
.hli.lost .lx:hover{color:var(--danger)}
.fread{width:100%;max-width:38em;font-family:var(--font-text);font-size:var(--fs,17px);line-height:1.95;letter-spacing:.01em;min-height:60vh;color:var(--ink);overflow-wrap:anywhere}
.fread>div{white-space:pre-wrap;min-height:1.95em}
.fread .rh{font-weight:700;line-height:1.5;margin:.5em 0 .2em}
.fread .rh1{font-size:1.45em}.fread .rh2{font-size:1.25em}.fread .rh3{font-size:1.1em}
.fread .rq{border-left:3px solid var(--card-edge);padding-left:.9em;color:var(--muted)}
.fread .rhr{min-height:0;height:1px;background:var(--card-edge);margin:.9em 0}
.fread .rempty{color:var(--muted);font-style:italic}
.rimg{display:inline-block;max-width:100%;padding:0;margin:.35em 0;border:0;background:transparent;cursor:zoom-in;vertical-align:top}
.rimg img{display:block;max-width:100%;max-height:80vh;height:auto;border-radius:3px}
.rimg img:not([src]){width:12em;height:8em;background:var(--board-shade)}

.fnav{display:flex;gap:10px;justify-content:space-between;border-top:1px solid var(--card-edge);padding:10px 16px}

.fnav>button{flex:1 1 0;min-width:0}
.fnav>button#fnext{text-align:right}
.fnav button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fnav button:hover:not(:disabled){background:var(--board-shade);color:var(--ink)}
.fnav button:disabled{opacity:.3;cursor:default}
.frnd{flex:none;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.frnd span{margin:0 4px 0 2px}
.frnd button{border:1px solid var(--line);padding:3px 10px;font-size:12px}
.frnd button:hover{border-color:var(--accent);color:var(--accent)}
svg.die{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;vertical-align:-3px}
svg.die circle{fill:currentColor;stroke:none}
.rnd{position:relative}
.rndmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:6px;min-width:13em;display:flex;flex-direction:column;gap:2px}
.rndmenu button{display:flex;flex-direction:column;align-items:flex-start;border:0;background:transparent;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:13.5px;color:var(--ink);text-align:left}
.rndmenu button:hover,.rndmenu button:focus-visible{background:var(--board-shade)}
.rndmenu small{font-size:11px;color:var(--muted)}
.rndmenu p{margin:4px 10px 2px;font-size:11px;color:var(--muted)}

/* continuous read view */
.read{position:absolute;inset:0;overflow:auto;background:var(--board);padding:28px 16px 80px}
.sheet{max-width:46em;margin:0 auto;background:var(--card);box-shadow:var(--shadow);border-radius:3px;padding:40px clamp(18px,6vw,64px)}
.sec + .sec{margin-top:32px}
.sec-h{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--card-edge);padding-bottom:6px;margin-bottom:8px;cursor:pointer}
.sec-h b{font-size:15px}
.sec-h span{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.sec-h:hover b{color:var(--accent)}
.sec-syn{font-family:var(--font-text);font-size:13px;color:var(--muted);margin:0 0 10px;font-style:italic;white-space:pre-line}
.sec textarea{width:100%;border:0;resize:none;background:transparent;overflow:hidden;font-family:var(--font-text);font-size:var(--fs,17px);line-height:1.95;padding:0;min-height:2em}

/* links between cards */
.board{z-index:0} /* keeps the lines inside the board, under the open editor */
.links{position:absolute;top:0;left:0;pointer-events:none;z-index:2;overflow:visible}
.lk{opacity:.26;transition:opacity .15s}
.lk .ls{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 5;stroke-linecap:round}
.lk .la,.lk circle{fill:var(--muted)}
.lk text{font:11px var(--font-ui);fill:var(--muted);paint-order:stroke;stroke:var(--board);stroke-width:4px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:middle}
.links.hashot .lk{opacity:.08}
.links.hashot .lk.hot{opacity:1}
.lk.hot .ls{stroke:var(--accent);stroke-width:1.9}
.lk.hot .la,.lk.hot circle{fill:var(--accent)}
.lk.hot text{fill:var(--ink);font-weight:600}
.card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body.linking .card{cursor:crosshair}
.card.linksrc{outline:2px dashed var(--accent);outline-offset:4px}
.linkbar{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);padding:7px 8px 7px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;max-width:calc(100vw - 24px)}

.cmenu{position:fixed;z-index:70;display:flex;flex-direction:column;min-width:12em;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px}

.ldlg{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;padding:16px}

.ldtitle{margin:0;font-weight:600;line-height:1.5}
.ldtitle i{font-style:normal;font-weight:400;color:var(--muted);margin:0 2px}
.ldtitle span,.flink em,.lpicks em{font-family:var(--font-mono);font-size:10.5px;font-weight:400;font-style:normal;color:var(--muted);margin-left:6px}
.ldir{display:flex;flex-wrap:wrap;gap:6px}
.ldir button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.ldir button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.ldbtns{display:flex;justify-content:flex-end;gap:8px}
.flinks{display:flex;flex-direction:column;gap:4px}

.flink span.lnote{flex:1;font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.flink .lx{flex:none;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;padding:0 4px}
.flink .lx:hover{color:var(--danger)}
.lnone{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.lpick{position:relative}
.face .lpick input{font-size:13px;font-weight:400}
.lpicks{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:3px;display:flex;flex-direction:column;max-height:16em;overflow:auto}
.lpicks button{border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:4px;font-size:13px;color:var(--ink);cursor:pointer}

.dkey input{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 9px;font-family:var(--font-mono);font-size:13px}
.dpick{padding:0 26px}

.dlist{max-height:46vh;overflow:auto}

.dpick .wbtns{padding:12px 0 0}

.mtabs,.scrim,.mob{display:none}
@media (max-width:700px){

  .ftop{padding:8px 12px 6px;gap:8px 10px;flex-wrap:wrap}
  #fpos,.fname,#faceToggle,.kesc{display:none}
  .ftop select#fmove{max-width:7em}

  #fstatus,#fswatch,#fwc{order:1}
  #fclose{order:2;margin-left:auto}

  .mtabs{display:flex;justify-content:space-around;border-top:1px solid var(--card-edge);padding:3px 8px}

}

<body>

<div class="welcome" id="welcome">
  <div class="wcard">
    <h1>卡片写作台</h1>
    <div class="lines">
      <p>选一个文件夹当「书房」，比如 corkboard works。</p>
      <p>里面每个子文件夹是一个项目，</p>
      <p>每张卡片是项目里的一个 Markdown 文件。</p>
    </div>
    <div class="wbtns">
      <button class="btn" id="resume" hidden></button>
      <button class="btn ghost" id="pick">打开书房文件夹…</button>

<script>
"use strict";
/* The iOS app signs in to Dropbox in the system sign-in window, which Dropbox sends back to this web page
   with state "app-…". Hand the result straight to the app (corkboard://) and stop here. */
if(/^app-/.test(new URLSearchParams(location.search).get("state")||"")){location.replace("corkboard://auth"+location.search);throw new Error("交给 App 完成登录")}
/* running inside the iOS app (a WebView in app/App.js) */
const inApp=()=>!!window.ReactNativeWebView;
const STATUSES=[["idea","构思","var(--s-idea)"],["draft","初稿","var(--s-draft)"],["rev","修改中","var(--s-rev)"],["done","定稿","var(--s-done)"]];
const PINS=[["blue","#2e5b86"],["red","#c9574c"],["amber","#d39a2c"],["green","#3f8f5a"],["purple","#7a5aa6"],["grey","#6b7378"]];
const TRASH="_回收站", EXPORT="_全文.md";
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CJK=/[㐀-鿿豈-﫿぀-ヿ]/g;
/* images in the text, the way iA Writer / Obsidian write them: ![说明](_图片/a.jpg) or Obsidian's ![[a.jpg]]; they never count as words */
const IMG_RE=/!\[[^\]\n]*\]\(\s*(<[^>\n]+>|[^)\s]+)(?:\s+["'][^"'\n]*["'])?\s*\)|!\[\[([^\]|#\n]+)(?:[|#][^\]\n]*)?\]\]/g;
const isImgName=n=>/\.(png|jpe?g|gif|webp|avif|bmp|svg|heic|heif)$/i.test(n||"");
function imgRefs(s){
  const out=[],seen=new Set();if(!s)return out;
  for(const m of s.matchAll(IMG_RE)){
    const r=m[1]?{ref:m[1][0]==="<"?m[1].slice(1,-1):m[1],wiki:false}:{ref:m[2].trim(),wiki:true};
    if(r.wiki&&!isImgName(r.ref))continue; /* ![[某笔记]] embeds a note, not a picture */
    const k=(r.wiki?"w:":"m:")+r.ref;if(!seen.has(k)){seen.add(k);out.push(r)}
  }
  return out;
}
const stripImgs=s=>s?s.replace(IMG_RE," "):"";
function wc(s){if(!s)return 0;s=stripImgs(s);const c=(s.match(CJK)||[]).length;const w=(s.replace(CJK," ").match(/[A-Za-z0-9'’-]+/g)||[]).length;return c+w}
const st=k=>STATUSES.find(s=>s[0]===k)||STATUSES[0];
const statusKey=v=>(STATUSES.find(s=>s[0]===v||s[1]===v)||STATUSES[0])[0];
const pinKey=v=>(PINS.find(p=>p[0]===v||p[1]===v)||PINS[0])[0];
const pinColor=k=>(PINS.find(p=>p[0]===k)||PINS[0])[1];
let toastT;
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- Markdown + front matter ---------- */
function parseYaml(s){
  const lines=s.split(/\r?\n/),o={};
  for(let i=0;i<lines.length;i++){
    const m=lines[i].match(/^([A-Za-z_][\w-]*):\s*(.*)$/);if(!m)continue;
    const k=m[1],v=m[2].trim();
    if(/^[|>][-+]?$/.test(v)){
      const buf=[];
      while(i+1<lines.length&&(/^\s/.test(lines[i+1])||lines[i+1]==="")){i++;buf.push(lines[i].replace(/^ {2}/,""))}
      while(buf.length&&buf[buf.length-1]==="")buf.pop();
      o[k]=buf.join("\n");
    }else if(/^".*"$/.test(v)){try{o[k]=JSON.parse(v)}catch(e){o[k]=v.slice(1,-1)}}
    else if(/^'.*'$/.test(v))o[k]=v.slice(1,-1).replace(/''/g,"'");
    else if(/^\[.*\]$/.test(v)){try{o[k]=JSON.parse(v)}catch(e){o[k]=v.slice(1,-1).split(",").map(x=>x.trim().replace(/^["']|["']$/g,""))}}
    else if(v===""&&i+1<lines.length&&/^\s*-\s/.test(lines[i+1])){
      /* block list, as Obsidian writes it:  tags:\n  - a\n  - b */
      const arr=[];
      while(i+1<lines.length&&/^\s*-\s/.test(lines[i+1])){i++;let x=lines[i].replace(/^\s*-\s+/,"").trim();
        if(/^".*"$/.test(x)){try{x=JSON.parse(x)}catch(e){}}else if(/^'.*'$/.test(x))x=x.slice(1,-1);arr.push(x)}
      o[k]=arr;
    }
    else o[k]=v;
  }
  return o;
}
/* tags: no leading #, no spaces (Obsidian-compatible), no duplicates */
function normTags(v){
  const arr=Array.isArray(v)?v:typeof v==="string"?v.split(/[,，\s]+/):[];
  const out=[];
  arr.forEach(t=>{t=String(t).trim().replace(/^#+/,"").replace(/[\s,，]+/g,"-");if(t&&!out.some(x=>x.toLowerCase()===t.toLowerCase()))out.push(t)});
  return out;
}
function parseMd(text){
  text=text.replace(/^﻿/,"");
  const m=text.match(/^---\r?\n([\s\S]*?)\r?\n---[ \t]*(\r?\n|$)/);
  if(!m)return{meta:{},body:text};
  return{meta:parseYaml(m[1]),body:text.slice(m[0].length).replace(/^\r?\n/,"")};
}
function toMd(c){
  const blk=(k,v)=>v.trim()?`${k}: |\n${v.replace(/\s+$/,"").split("\n").map(l=>l?"  "+l:"").join("\n")}\n`:`${k}: ""\n`;
  const tags=(c.tags&&c.tags.length?`tags: ${JSON.stringify(c.tags)}\n`:"")+(c.links&&c.links.length?`links: ${JSON.stringify(c.links)}\n`:"")+(c.hlnotes&&c.hlnotes.length?`hlnotes: ${JSON.stringify(c.hlnotes)}\n`:"");
  return `---\nid: ${c.id}\ntitle: ${JSON.stringify(c.title)}\nstatus: ${st(c.status)[1]}\npin: ${c.pin}\n${c.created?`created: ${c.created}\n`:""}${tags}${blk("synopsis",c.synopsis)}${blk("notes",c.notes)}${(c.drafts||"").trim()?blk("drafts",c.drafts):""}---\n\n${c.body}`;
}

/* ---------- remembered folder (IndexedDB) ---------- */
function idb(mode,fn){return new Promise((res,rej)=>{
  let r;try{r=indexedDB.open("carddesk",1)}catch(e){return rej(e)}
  r.onupgradeneeded=()=>r.result.createObjectStore("kv");
  r.onerror=()=>rej(r.error);
  r.onsuccess=()=>{const tx=r.result.transaction("kv",mode),q=fn(tx.objectStore("kv"));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)};
})}
const idbGet=k=>idb("readonly",s=>s.get(k)).catch(()=>null);
const idbSet=(k,v)=>idb("readwrite",s=>s.put(v,k)).catch(()=>null);

/* ---------- Dropbox storage (phones, or any browser without local folder access) ----------
   DbxDir / DbxFile imitate the few File System Access handle methods the rest of this file uses
   (entries, getFileHandle, getDirectoryHandle, removeEntry, getFile, createWritable), so everything
   else works the same on Dropbox. Sign-in is OAuth PKCE straight from the browser: no server in between.
   Safety: card files are written with Dropbox's "update" mode. If another device changed the file since
   we read it, that version is saved to <项目>/_冲突/ first, then ours is written, so nothing is lost.
   removeEntry is only called where the local version calls it (trash / rename / move). */
const DBX_APP_KEY="y90nkl5yexfo8db"; /* App key of the user's Dropbox app (App folder access); public by design with PKCE, not a secret */
const DBX={access:null,exp:0,refresh:null,refreshing:null};
const dbxBased=new Map(); /* path (lower case) → rev of the version we last read or wrote */
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
function dbxSaved(){try{return JSON.parse(lsGet("carddesk.dbx")||"{}")}catch(e){return{}}}
function dbxSave(o){lsSet("carddesk.dbx",JSON.stringify(Object.assign(dbxSaved(),o)))}
const dbxKey=()=>DBX_APP_KEY||lsGet("carddesk.dbxkey")||"";
const dbxRedirect=()=>new URL("./",location.href).href;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function dbxLogin(){
  const key=dbxKey();if(!key){$("dkey").hidden=false;$("dkeyin").focus();toast("先填上 Dropbox App key");return}
  const ver=b64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(ver)));
  const state=(inApp()?"app-":"")+uid();lsSet("carddesk.pkce",JSON.stringify({ver,state}));
  const url="https://www.dropbox.com/oauth2/authorize?"+new URLSearchParams({client_id:key,response_type:"code",code_challenge:challenge,
    code_challenge_method:"S256",redirect_uri:dbxRedirect(),token_access_type:"offline",state});
  /* in the app: the app opens the system sign-in window and later calls window.__appAuthBack with the result */
  if(inApp())window.ReactNativeWebView.postMessage(JSON.stringify({type:"auth",url}));
  else location.href=url;
}
async function dbxTokenCall(params){
  const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",body:new URLSearchParams(Object.assign({client_id:dbxKey()},params))});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error_description||j.error||("HTTP "+r.status));e.auth=true;throw e}
  DBX.access=j.access_token;DBX.exp=Date.now()+((j.expires_in||14400)-120)*1000;
  if(j.refresh_token){DBX.refresh=j.refresh_token;dbxSave({refresh:j.refresh_token})}
  return DBX.access;
}
/* back from the Dropbox sign-in page with ?code=… */
async function dbxFinishLogin(q=new URLSearchParams(location.search),fromApp=false){
  if(!q.has("code")&&!q.has("error"))return false;
  if(!fromApp)history.replaceState(null,"",location.pathname);
  const p=JSON.parse(lsGet("carddesk.pkce")||"{}");lsSet("carddesk.pkce",null);
  if(q.has("error"))throw new Error(q.get("error_description")||q.get("error"));
  if(!p.ver||p.state!==q.get("state"))throw new Error("登录状态对不上，请再试一次");
  await dbxTokenCall({grant_type:"authorization_code",code:q.get("code"),code_verifier:p.ver,redirect_uri:dbxRedirect()});
  return true;
}
function dbxToken(){
  if(DBX.access&&Date.now()<DBX.exp)return Promise.resolve(DBX.access);
  if(!DBX.refresh)return Promise.reject(Object.assign(new Error("还没有登录 Dropbox"),{auth:true}));
  return DBX.refreshing||(DBX.refreshing=dbxTokenCall({grant_type:"refresh_token",refresh_token:DBX.refresh}).finally(()=>DBX.refreshing=null));
}
/* HTTP headers must be ASCII: Chinese file names go into Dropbox-API-Arg as \uXXXX */
const asciiJson=o=>JSON.stringify(o).replace(/[\u007f-￿]/g,c=>"\\u"+c.charCodeAt(0).toString(16).padStart(4,"0"));
async function dbx(endpoint,arg,{content=false,body=null,raw=false}={}){
  for(let tries=0;;tries++){
    const headers={Authorization:"Bearer "+await dbxToken()};
    let url="https://api.dropboxapi.com/2/"+endpoint,payload;
    if(content){url="https://content.dropboxapi.com/2/"+endpoint;headers["Dropbox-API-Arg"]=asciiJson(arg);if(body!=null){headers["Content-Type"]="application/octet-stream";payload=body}}
    else{headers["Content-Type"]="application/json";payload=JSON.stringify(arg)}
    let r;
    try{r=await fetch(url,{method:"POST",headers,body:payload})}
    catch(e){if(tries<3){await sleep(700*(tries+1));continue}throw new Error("连不上 Dropbox，请检查网络")}
    if(r.status===401&&tries<1){DBX.access=null;continue}
    if((r.status===429||r.status>=500)&&tries<4){await sleep((+r.headers.get("Retry-After")||tries+1)*1000);continue}
    if(r.status===409){const j=await r.json().catch(()=>({}));const e=new Error(j.error_summary||"Dropbox 冲突");e.summary=j.error_summary||"";if(/not_found/.test(e.summary))e.name="NotFoundError";throw e}
    if(!r.ok){const t=await r.text().catch(()=>"");const e=new Error(`Dropbox ${r.status} ${t.slice(0,140)}`);if(r.status===401)e.auth=true;throw e}
    return raw?r:r.json();
  }
}
const dbxUpload=(path,text,mode,autorename=false)=>dbx("files/upload",{path,mode,autorename,mute:true},{content:true,body:new Blob([text])});
async function dbxDownload(path){
  const r=await dbx("files/download",{path},{content:true,raw:true});let m=null;
  try{m=JSON.parse(r.headers.get("Dropbox-API-Result"))}catch(e){}
  return{text:await r.text(),meta:m};
}
/* the code compares lastModified for equality only; adding a small hash of rev makes two versions saved in the same second differ */
function dbxTime(m){let h=0;for(const ch of m.rev||"")h=(h*31+ch.charCodeAt(0))%997;return Date.parse(m.server_modified||m.client_modified||0)+h}
class DbxFile{
  constructor(parent,name,meta){
    this.kind="file";this.dbx=true;this.parent=parent;this.name=name;this.path=parent.path+"/"+name;this.meta=meta||null;
    /* card files get the conflict check; project.json, _全文.md and anything inside _回收站/ etc. are simply overwritten */
    this.guard=/\.md$/i.test(name)&&!/^[_.]/.test(name)&&!this.path.split("/").slice(0,-1).some(s=>/^[_.]/.test(s));
  }
  get key(){return this.path.toLowerCase()}
  setMeta(m){if(!m)return;this.meta=m;dbxBased.set(this.key,m.rev);this.parent.kids.set(this.name,this)}
  async getFile(){
    if(!this.meta)this.meta=await dbx("files/get_metadata",{path:this.path});
    const f=this,m=this.meta;
    return{name:f.name,size:m.size,lastModified:dbxTime(m),
      text:async()=>{const d=await dbxDownload(f.path);if(d.meta)f.setMeta(d.meta);else dbxBased.set(f.key,m.rev);return d.text}};
  }
  /* text for cards, a Blob for pictures */
  async createWritable(){const f=this,parts=[];return{write:async t=>{parts.push(t)},close:()=>dbxPut(f,parts.every(p=>typeof p==="string")?parts.join(""):new Blob(parts))}}
}
const dbxBlob=async path=>(await dbx("files/download",{path},{content:true,raw:true})).blob();
/* a small JPEG made by Dropbox: card faces on the phone don't have to download whole photos */
const dbxThumb=async path=>(await dbx("files/get_thumbnail_v2",{resource:{".tag":"path",path},format:"jpeg",size:"w640h480",mode:"bestfit"},{content:true,raw:true})).blob();
async function dbxPut(f,text){
  if(!f.guard){f.setMeta(await dbxUpload(f.path,text,{".tag":"overwrite"}));return}
  const rev=dbxBased.get(f.key);
  try{f.setMeta(await dbxUpload(f.path,text,rev?{".tag":"update",update:rev}:{".tag":"add"}));return}
  catch(e){if(!/conflict/.test(e.summary||""))throw e}
  /* changed on another device since we read it: keep that version in _冲突/, then write ours */
  let theirs=null;
  try{theirs=await dbxDownload(f.path)}catch(e){if(e.name!=="NotFoundError")throw e}
  if(theirs&&theirs.text!==text){
    const d=new Date(),p=n=>String(n).padStart(2,"0"),base=f.name.replace(/\.md$/i,"");
    const stamp=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}${p(d.getMinutes())}`;
    await dbxUpload(`${f.parent.path}/_冲突/${base} ${stamp}.md`,theirs.text,{".tag":"add"},true);
    toast(`「${base}」在别的设备上也改过：那个版本存进了 _冲突/，这里的照常保存`);
  }
  f.setMeta(await dbxUpload(f.path,text,theirs&&theirs.meta?{".tag":"update",update:theirs.meta.rev}:{".tag":"overwrite"}));
}
class DbxDir{
  constructor(path,name){this.kind="directory";this.dbx=true;this.path=path;this.name=name??path.split("/").pop();this.kids=new Map()}
  async *entries(){
    let res=await dbx("files/list_folder",{path:this.path,limit:2000});const all=[...res.entries];
    while(res.has_more){res=await dbx("files/list_folder/continue",{cursor:res.cursor});all.push(...res.entries)}
    const kids=new Map();
    for(const m of all){
      if(m[".tag"]==="folder"){const old=this.kids.get(m.name);kids.set(m.name,old&&old.kind==="directory"?old:new DbxDir(this.path+"/"+m.name,m.name))}
      else if(m[".tag"]==="file")kids.set(m.name,new DbxFile(this,m.name,m));
    }
    this.kids=kids;
    for(const e of [...kids])yield e;
  }
  async getFileHandle(name,o={}){
    const k=this.kids.get(name);if(k&&k.kind==="file")return k;
    try{
      const m=await dbx("files/get_metadata",{path:this.path+"/"+name});
      if(m[".tag"]!=="file")throw Object.assign(new Error(name+" 不是文件"),{name:"TypeMismatchError"});
      const f=new DbxFile(this,name,m);this.kids.set(name,f);return f;
    }catch(e){if(e.name!=="NotFoundError"||!o.create)throw e;return new DbxFile(this,name,null)}
  }
  async getDirectoryHandle(name,o={}){
    const k=this.kids.get(name);if(k&&k.kind==="directory")return k;
    const path=this.path+"/"+name;
    try{const m=await dbx("files/get_metadata",{path});if(m[".tag"]!=="folder")throw Object.assign(new Error(name+" 不是文件夹"),{name:"TypeMismatchError"})}
    catch(e){if(e.name!=="NotFoundError"||!o.create)throw e;
      await dbx("files/create_folder_v2",{path}).catch(e2=>{if(!/conflict/.test(e2.summary||""))throw e2})}
    const d=new DbxDir(path,name);this.kids.set(name,d);return d;
  }
  async removeEntry(name){
    const path=this.path+"/"+name;
    try{await dbx("files/delete_v2",{path})}catch(e){if(e.name!=="NotFoundError")throw e}
    this.kids.delete(name);dbxBased.delete(path.toLowerCase());
  }
}
/* run fn over arr with at most n at a time (network reads are much faster in parallel) */
async function pmap(arr,fn,n=8){
  const out=new Array(arr.length);let i=0;
  await Promise.all(Array.from({length:Math.min(n,arr.length)},async()=>{while(i<arr.length){const k=i++;out[k]=await fn(arr[k],k)}}));
  return out;
}

/* ---------- project state ---------- */
let root=null,projects=[],curName=null,moving=false;

const byId=id=>cards.find(c=>c.id===id);
const isCardFile=(name,h)=>h.kind==="file"&&/\.md$/i.test(name)&&!/^[_.]/.test(name);

async function readCard(name,h){
  const f=await h.getFile(),{meta,body}=parseMd(await f.text());
  /* created: written by the corkboard when a card is made; a new file from outside (no id yet) gets its file time */
  const created=meta.created?String(meta.created):meta.id?"":stamp(f.lastModified);
  return{id:meta.id||uid(),needsWrite:!meta.id,file:name,mtime:f.lastModified,created,
    title:meta.title!=null&&meta.title!==""?String(meta.title):name.replace(/\.md$/i,""),
    status:statusKey(meta.status),pin:pinKey(meta.pin),tags:normTags(meta.tags),links:normLinks(meta.links),hlnotes:normHLNotes(meta.hlnotes),synopsis:meta.synopsis||"",notes:meta.notes||"",drafts:meta.drafts||"",body};
}
/* ---------- workspace (书房) = folder whose subfolders are projects ---------- */
async function readJson(dh,name){try{return JSON.parse(await(await(await dh.getFileHandle(name)).getFile()).text())}catch(e){return{}}}
async function writeText(dh,name,text){const h=await dh.getFileHandle(name,{create:true});const w=await h.createWritable();await w.write(text);await w.close();return h}
async function scanProjects(){
  if(!root)return;
  const dirs=[];
  for await(const [name,h] of root.entries())if(h.kind==="directory"&&!/^[_.]/.test(name))dirs.push([name,h]);
  const list=await pmap(dirs,async([name,h])=>{
    const pj=await readJson(h,"project.json");let count=0;
    for await(const [n,f] of h.entries())if(isCardFile(n,f))count++;
    return{name,handle:h,title:pj.title||name,count};
  });
  list.sort((a,b)=>a.name.localeCompare(b.name,"zh"));
  projects=list;renderSide();
}
function showShell(){$("welcome").hidden=true;$("bar").hidden=false;$("main").hidden=false}

/* move or copy one card into another project: write it there first; a move then removes it here */
async function moveCard(c,target,copy){
  if(!c||!target||target.name===curName||moving)return;
  moving=true;
  try{
    clearTimeout(c.t);if(c.dirty)writeCard(c);await c.q;
    const td=target.handle,names=new Set(),ids=new Set();
    for await(const [n,h] of td.entries()){
      if(!isCardFile(n,h))continue;names.add(n);
      try{const m=parseMd(await(await h.getFile()).text()).meta;if(m.id)ids.add(String(m.id))}catch(e){}
    }
    const moved=Object.assign({},c);if(copy||ids.has(moved.id))moved.id=uid();
    /* its links now point back to this project (or, for cards in the target project, no longer need a project) */
    moved.links=(c.links||[]).map(l=>{const n=Object.assign({},l),p=l.proj||curName;if(p===target.name)delete n.proj;else n.proj=p;return n});
    await copyImgs(moved,td);
    const base=sanitize(c.title)||"未命名";let n=base+".md",k=2;
    while(names.has(n))n=`${base} ${k++}.md`;
    await writeText(td,n,toMd(moved));
    const pj=await readJson(td,"project.json");
    const order=Array.isArray(pj.order)?pj.order:[];order.push(moved.id);
    await writeText(td,"project.json",JSON.stringify(Object.assign({title:pj.title||td.name,goal:+pj.goal||30000},SORTS[pj.sort]&&pj.sort!=="manual"?{sort:pj.sort}:{},{order}),null,2)+"\n");
    target.count++;buildIndex();
    if(copy){renderBoard();renderSide();toast(`「${c.title||"未命名"}」已复制到 ${target.title}`)}
    else{
      if(c.file)await dir.removeEntry(c.file);
      cards.splice(cards.indexOf(c),1);
      if(openId===c.id)closeCardNow();
      renderBoard();await saveProject();renderSide();
      toast(`「${c.title||"未命名"}」已移到 ${target.title}`);
    }
  }catch(err){toast((copy?"复制":"移动")+"失败："+err.message);renderBoard()}
  moving=false;
}

async function openProject(handle){
  dir=handle;openId=null;curName=handle.name;query="";$("search").value="";
  if(root)idbSet("lastProject",handle.name);
  let pj={};
  try{pj=JSON.parse(await(await(await dir.getFileHandle("project.json")).getFile()).text())}catch(e){}
  P={title:pj.title||dir.name,goal:+pj.goal||30000,order:Array.isArray(pj.order)?pj.order:[],sort:SORTS[pj.sort]?pj.sort:"manual"};
  $("sortSel").value=P.sort;
  const hs=[];
  for await(const [name,h] of dir.entries())if(isCardFile(name,h))hs.push([name,h]);
  const found=await pmap(hs,([name,h])=>readCard(name,h));
  const idx=id=>{const i=P.order.indexOf(id);return i<0?1e9:i};
  found.sort((a,b)=>idx(a.id)-idx(b.id)||a.file.localeCompare(b.file,"zh"));
  cards=found;
  for(const c of cards)if(c.needsWrite){c.needsWrite=false;await writeCard(c)}

}

/* ---------- writing to disk ---------- */
let pending=0;
function setSave(t,err){

    for await(const [name,h] of dir.entries()){

    try{

      if(segs.includes(".."))continue;
      let blob;
      if(d.dbx){
        const path=d.path+"/"+segs.join("/");
        if(small&&!/\.(svg|gif)$/i.test(path))try{blob=await dbxThumb(path)}catch(e){if(e.name==="NotFoundError")throw e}
        if(!blob)blob=await dbxBlob(path);

/* moving / copying a card to another project takes its pictures in _图片/ along (copies them; nothing is deleted) */
async function copyImgs(card,td){
  const names=new Set();

    const s=refSegs(r.ref);
    if(!r.wiki&&s.length===2&&s[0]===IMGDIR)names.add(s[1]);

  }
  if(!names.size)return;
  let src;try{src=await dir.getDirectoryHandle(IMGDIR)}catch(e){return}

  for await(const [n,h] of dst.entries())if(h.kind==="file")have.set(n.toLowerCase(),h);

/* full-screen picture: wheel / trackpad pinch / two fingers zoom around the pointer, drag to look around, double-click (double-tap) = back to fit / zoom in */
const LB={s:1,x:0,y:0,pts:new Map(),pinch:null,dragged:false};
const lbImg=()=>$("lbox").querySelector("img");
function lbApply(){
  const img=lbImg();img.style.transform=LB.s===1?"":`translate(${LB.x}px,${LB.y}px) scale(${LB.s})`;
  $("lbox").classList.toggle("zoomed",LB.s>1);

/* zoom to scale s keeping the point (cx,cy) on screen where it is */
function lbZoom(s,cx,cy){
  s=Math.min(8,Math.max(1,s));
  const r=lbImg().getBoundingClientRect(),bx=r.left-LB.x,by=r.top-LB.y; /* untransformed top-left (transform-origin 0 0) */
  const ux=(cx-bx-LB.x)/LB.s,uy=(cy-by-LB.y)/LB.s;
  LB.x=cx-bx-ux*s;LB.y=cy-by-uy*s;LB.s=s;

  if(e.target.closest(".lclose"))return;

  try{lb.setPointerCapture(e.pointerId)}catch(_){}
  LB.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(Math.abs(dx)+Math.abs(dy)>1)LB.dragged=true;

  if(e.type==="pointerup"&&was===1&&!LB.dragged&&LB.onImg){
    const now=Date.now();

/* ---------- search: words match title/synopsis/notes/body/tags; #tag matches a tag exactly; all terms must match ---------- */
let query="";
function parseQuery(q){
  const words=[],tags=[];
  q.trim().split(/\s+/).filter(Boolean).forEach(t=>{if(t[0]==="#"||t[0]==="＃"){const x=t.slice(1);if(x)tags.push(x.toLowerCase())}else words.push(t.toLowerCase())});
  return{words,tags,on:words.length+tags.length>0};
}
function matches(c,Q){
  if(!Q.on)return true;
  const tl=(c.tags||[]).map(t=>t.toLowerCase());
  if(!Q.tags.every(t=>tl.includes(t)))return false;
  const hay=[c.title,c.synopsis,c.notes,c.drafts||"",c.body,tl.join(" "),...(c.hlnotes||[]).map(n=>n.note)].join("\n").toLowerCase();
  return Q.words.every(w=>hay.includes(w));
}
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function hl(text,words){
  if(!words.length)return esc(text);
  const re=new RegExp("("+words.map(reEsc).join("|")+")","gi");
  return text.split(re).map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join("");
}
function snippet(text,words){
  const low=text.toLowerCase();let at=-1;
  for(const w of words){const i=low.indexOf(w);if(i>=0&&(at<0||i<at))at=i}
  if(at<0)return null;
  const s=Math.max(0,at-24),e=Math.min(text.length,at+66);
  return(s>0?"…":"")+text.slice(s,e).replace(/\s+/g," ")+(e<text.length?"…":"");
}
function cardHTML(c,ext){
  const Q=parseQuery(query),W=Q.words;
  /* card face shows the first thing that has text: body, then synopsis, then notes (muted), else （空白卡片）; image links are left out of the text */
  const tidy=s=>stripImgs(s).replace(HL_RE,"$1").replace(/[ \t]*\n[ \t]*(\n[ \t]*)+/g,"\n").trim();
  const b=tidy(c.body),sy=c.synopsis.trim(),no=tidy(c.notes||""),dr=tidy(c.drafts||"");
  /* the first picture of the body (else of the notes) goes on the card face */
  const pic=imgRefs(c.body)[0]||imgRefs(c.notes)[0];
  let syn=b?b.slice(0,240):sy?c.synopsis:no?no.slice(0,240):dr?dr.slice(0,240):pic?"":"（空白卡片）",cls=b||sy?"":" auto";
  /* the hit is only in the body or notes: show the passage around it instead of the synopsis */
  if(W.length&&!W.some(w=>(c.title+"\n"+syn).toLowerCase().includes(w))){
    const sn=snippet(c.body,W)||snippet(c.notes,W)||snippet(c.drafts||"",W);if(sn){syn=sn;cls=" hit"}
  }
  const s=st(c.status),tags=c.tags||[];
  return `<span class="pin" style="--pin:${pinColor(c.pin)}"></span><h3>${hl(c.title||"未命名",W)}</h3>
  ${pic?`<div class="cimg${syn?"":" only"}">${imgTag(pic,ext||curName,true)}</div>`:""}${syn?`<div class="syn${cls}">${hl(syn,W)}</div>`:""}
  ${tags.length?`<div class="tags">${tags.map(t=>`<span class="tag" data-tag="${esc(t)}" title="只看 #${esc(t)}">${esc(t)}</span>`).join("")}</div>`:""}
  <footer><span class="dot" style="background:${s[2]}"></span>${s[1]}<span class="wc">${wc(c.body)} 字</span></footer>`;
}
function visibleCards(){const Q=parseQuery(query);return sortCards(cards.filter(c=>matches(c,Q)))}
/* ---------- sort: 手动 = the drag order saved in project.json (order); the others only change how the board shows them ---------- */
const SORTS={manual:"手动排序（拖动）",created_desc:"创建时间：新 → 旧",created_asc:"创建时间：旧 → 新",modified_desc:"修改时间：新 → 旧",modified_asc:"修改时间：旧 → 新",name_asc:"名称：A → Z",name_desc:"名称：Z → A"};
const manualSort=()=>!P||!P.sort||P.sort==="manual";
function stamp(t){const d=new Date(t),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function sortCards(list,mode=P&&P.sort){
  if(!mode||mode==="manual")return list;
  const [k,dir]=mode.split("_"),sg=dir==="desc"?-1:1,ix=new Map(list.map((c,i)=>[c,i]));
  const name=c=>c.title||"未命名";
  const time=c=>k==="created"?(Date.parse(c.created||"")||null):(c.mtime||0);
  return list.slice().sort((a,b)=>{
    if(k==="name")return sg*name(a).localeCompare(name(b),"zh",{numeric:true,sensitivity:"base"})||ix.get(a)-ix.get(b);
    const x=time(a),y=time(b);
    /* cards made before creation times were recorded count as older than all the others, in their drag order */
    if(x==null||y==null)return x==null&&y==null?sg*(ix.get(a)-ix.get(b)):sg*(x==null?-1:1);

/* ---------- read-only index of the OTHER projects in the 书房 (for global tags + search across projects) ----------

let gIndex=new Map(),globalOn=false,indexing=null,indexReady=false;
function buildIndex(){
  if(indexing)return indexing;
  const forProj=curName;
  indexing=(async()=>{
    try{
      const m=new Map();
      if(root)for(const p of projects){
        if(p.name===curName)continue;
        const old=gIndex.get(p.name),hs=[];
        for await(const [n,h] of p.handle.entries())if(isCardFile(n,h))hs.push([n,h]);
        const list=await pmap(hs,async([n,h])=>{
          const f=await h.getFile(),prev=old&&old.cards.find(c=>c.file===n);
          if(prev&&prev.mtime===f.lastModified)return prev;
          const{meta,body}=parseMd(await f.text());
          return{id:String(meta.id||n),file:n,mtime:f.lastModified,created:meta.created?String(meta.created):"",
            title:meta.title!=null&&meta.title!==""?String(meta.title):n.replace(/\.md$/i,""),
            status:statusKey(meta.status),pin:pinKey(meta.pin),tags:normTags(meta.tags),links:normLinks(meta.links),hlnotes:normHLNotes(meta.hlnotes),
            synopsis:meta.synopsis||"",notes:meta.notes||"",drafts:meta.drafts||"",body,wc:wc(body)};
        },6);
        const pj=await readJson(p.handle,"project.json"),ord=Array.isArray(pj.order)?pj.order:[];
        const ix=id=>{const i=ord.indexOf(id);return i<0?1e9:i};
        list.sort((a,b)=>ix(a.id)-ix(b.id)||a.file.localeCompare(b.file,"zh"));
        m.set(p.name,{name:p.name,title:pj.title||p.name,cards:list,words:list.reduce((a,c)=>a+(isMaterial(c)?0:c.wc),0)});
      }
      gIndex=m;indexReady=true;
    }catch(e){}
    indexing=null;
    if(curName!==forProj)return buildIndex(); /* switched project while indexing: redo without the new current one */
    renderSideTags();renderTotals();renderSide();if(globalOn&&parseQuery(query).on&&view==="board")renderBoard();
    if(openId)renderFLinks();
  })();
  return indexing;
}

function todayKey(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function todayCount(){try{const o=JSON.parse(localStorage.getItem("carddesk.today")||"{}");return o.date===todayKey()?(+o.n||0):0}catch(e){return 0}}
/* cards tagged #素材 are reference material, not writing: their edits never count toward today's words */
const isMaterial=c=>(c.tags||[]).some(t=>t.toLowerCase()==="素材");
function addToday(delta,c){
  if(!delta||(c&&isMaterial(c)))return;
  try{localStorage.setItem("carddesk.today",JSON.stringify({date:todayKey(),n:todayCount()+delta}))}catch(e){}
}

/* ---------- focus (card opens in place) ---------- */
const focus=$("focus"),stage=$("stage");
$("fstatus").innerHTML=STATUSES.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("");
$("fswatch").innerHTML=PINS.map(p=>`<button style="background:${p[1]}" data-pin="${p[0]}" aria-label="标签颜色 ${p[0]}"></button>`).join("");
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
function fill(){
  const c=byId(openId);if(!c)return;const i=cards.indexOf(c);
  $("fpos").textContent=`第 ${i+1} 张 / 共 ${cards.length}`;
  $("ftitle").value=c.title;$("fsyn").value=c.synopsis;$("fnotes").value=c.notes;$("fdrafts").value=c.drafts||"";$("fbody").value=c.body;
  markTabs();
  $("fstatus").value=c.status;$("fname").textContent=c.file||"";$("fname").title=c.file||"";
  focus.style.setProperty("--pin",pinColor(c.pin));
  [...$("fswatch").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.pin===c.pin));
  $("fwc").textContent=wc(c.body)+" 字";
  const others=projects.map((p,i)=>[p,i]).filter(([p])=>p.name!==curName);
  $("fmove").hidden=!others.length;
  const opts=pre=>others.map(([p,i])=>`<option value="${pre}${i}">${esc(p.title)}</option>`).join("");
  $("fmove").innerHTML=`<option value="">移动 / 复制到…</option><optgroup label="移到">${opts("m")}</optgroup><optgroup label="复制到">${opts("c")}</optgroup>`;
  renderFTags();$("ftagin").value="";
  fillNav();disarmDel();renderFImgs(true);renderPreview();renderFLinks();renderHL();renderHLs();
  requestAnimationFrame(()=>grow($("fbody")));
}
function fillNav(){
  const L=visibleCards(),i=L.findIndex(c=>c.id===openId),p=i<0?null:L[i-1],n=i<0?null:L[i+1];
  $("fprev").disabled=!p;$("fprev").textContent=p?"← "+(p.title||"未命名"):"← 已是第一张";
  $("fnext").disabled=!n;$("fnext").textContent=n?(n.title||"未命名")+" →":"已是最后一张 →";
}
function animFrom(el,from,to,dur){
  return el.animate([{transform:`translate(${from.left-to.left}px,${from.top-to.top}px) scale(${from.width/to.width},${from.height/to.height})`},{transform:"none"}],{duration:dur,easing:"cubic-bezier(.2,.8,.2,1)"});
}
function openCard(id){
  if(view!=="board")setView("board");
  openId=id;setM("body");setPreview(false,true);fill();
  const el=$("grid").querySelector(`[data-id="${id}"]`);
  focus.hidden=false;stage.classList.add("focusing");
  if(el&&!reduced){
    el.scrollIntoView({block:"nearest"});
    animFrom(focus,el.getBoundingClientRect(),focus.getBoundingClientRect(),380);
    $("fx").animate([{opacity:0},{opacity:0,offset:.45},{opacity:1}],{duration:420});
  }
  if(el)el.classList.add("is-open");
  /* not on the phone: the keyboard would pop up and cover the card before you have read it */
  if(!mobile.matches)setTimeout(()=>{const b=$("fbody");b.focus();b.setSelectionRange(b.value.length,b.value.length)},reduced?0:380);
}
function closeCardNow(){openId=null;stage.classList.remove("focusing");focus.hidden=true}
function closeCard(){
  if(!openId)return;
  const id=openId;openId=null;
  const el=$("grid").querySelector(`[data-id="${id}"]`);
  stage.classList.remove("focusing");
  const done=()=>{focus.hidden=true;if(el){el.classList.remove("is-open");el.focus({preventScroll:true})}};
  if(el&&!reduced){
    el.scrollIntoView({block:"nearest"});
    const r=el.getBoundingClientRect(),f=focus.getBoundingClientRect();
    $("fx").animate([{opacity:1},{opacity:0}],{duration:140,fill:"forwards"});
    const a=focus.animate([{transform:"none"},{transform:`translate(${r.left-f.left}px,${r.top-f.top}px) scale(${r.width/f.width},${r.height/f.height})`}],{duration:300,easing:"cubic-bezier(.4,0,.2,1)"});
    a.onfinish=()=>{done();$("fx").getAnimations().forEach(x=>x.cancel())};
  }else done();
}
function step(d){
  const L=visibleCards(),i=L.findIndex(c=>c.id===openId),n=i<0?null:L[i+d];if(!n)return;
  swapTo(n.id,{opacity:0,transform:`translateX(${d*28}px)`});
}
/* show another card of this project in the already-open editor */
function swapTo(id,from){
  $("grid").querySelectorAll(".card.is-open").forEach(e=>e.classList.remove("is-open"));
  openId=id;$("grid").querySelector(`.card[data-id="${CSS.escape(id)}"]:not(.ext)`)?.classList.add("is-open");
  fill();
  if(!reduced)$("fx").animate([from,{opacity:1,transform:"none"}],{duration:260,easing:"ease-out"});
  if(!mobile.matches)$("fbody").focus();
}

/* ---------- random card ---------- */
const wantKind=kind=>c=>kind==="mat"?isMaterial(c):!isMaterial(c);
const kindName=kind=>kind==="mat"?"素材卡片":"原创卡片";
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
/* open a card of the current project, whether or not the editor is already open */
function showCard(id){
  if(parseQuery(query).on&&!visibleCards().some(c=>c.id===id))setQuery("");
  if(openId&&view==="board")swapTo(id,{opacity:0,transform:"scale(.97)"});else openCard(id);
}
/* 随机当前项目 (editor bottom bar) */
function randomHere(kind){
  const pool=cards.filter(c=>c.id!==openId&&wantKind(kind)(c));
  if(!pool.length){toast(`这个项目里没有其他${kindName(kind)}了`);return}
  showCard(pickOne(pool).id);
}
/* 随机卡片 (top bar): any project in the 书房 */
async function randomAnywhere(kind){
  if(!dir)return;
  if(root&&!indexReady)await buildIndex();
  const want=wantKind(kind),pool=[];
  cards.forEach(c=>{if(c.id!==openId&&want(c))pool.push({proj:curName,id:c.id,file:c.file})});
  for(const g of gIndex.values())g.cards.forEach(c=>{if(want(c))pool.push({proj:g.name,id:c.id,file:c.file})});
  if(!pool.length){toast(`书房里没有可以抽的${kindName(kind)}`);return}
  const x=pickOne(pool);
  if(x.proj===curName){showCard(x.id);return}
  const p=projects.find(q=>q.name===x.proj);if(!p)return;
  await switchProject(p);
  const c=byId(x.id)||cards.find(c=>c.file===x.file);
  if(c){openCard(c.id);toast(`抽到「${P.title}」里的一张`)}
}

/* tags in the editor: type + Enter (or comma) to add, × or Backspace on an empty box to remove */
function renderFTags(){
  const c=byId(openId);if(!c)return;
  $("ftags").querySelectorAll(".tag").forEach(x=>x.remove());
  (c.tags||[]).forEach((t,i)=>{
    const s=document.createElement("span");s.className="tag";s.textContent=t;
    const b=document.createElement("button");b.type="button";b.textContent="×";b.setAttribute("aria-label","删除标签 "+t);b.dataset.i=i;
    s.appendChild(b);$("ftags").insertBefore(s,$("ftagin"));
  });
}
function addTags(text){
  const c=byId(openId);if(!c)return;
  const add=normTags(text);if(!add.length)return;
  c.tags=normTags((c.tags||[]).concat(add));renderFTags();updateCard(c);renderSideTags();touch(c);
}
$("ftagin").addEventListener("keydown",e=>{
  const v=e.target.value;
  if(e.key==="Enter"||e.key===","||e.key==="，"){if(e.isComposing)return;e.preventDefault();addTags(v);e.target.value=""}
  else if(e.key==="Backspace"&&!v){const c=byId(openId);if(c&&c.tags&&c.tags.length){c.tags=c.tags.slice(0,-1);renderFTags();updateCard(c);renderSideTags();touch(c)}}
});
$("ftagin").addEventListener("change",e=>{if(e.target.value&&[...$("taglist").options].some(o=>o.value===e.target.value)){addTags(e.target.value);e.target.value=""}});
$("ftagin").addEventListener("blur",e=>{if(e.target.value.trim()){addTags(e.target.value);e.target.value=""}});
$("ftags").addEventListener("click",e=>{

  if(b){const c=byId(openId);c.tags=c.tags.filter((_,i)=>i!==+b.dataset.i);renderFTags();updateCard(c);renderSideTags();touch(c);return}

});

const FACE_DEFAULT=300;
function setFaceW(w,save){
  const fb=document.querySelector(".fbody"),max=Math.max(240,(fb.clientWidth||900)-320);
  w=Math.round(Math.min(max,Math.max(220,w)));

$("fsplit").addEventListener("pointerdown",e=>{

  sp.classList.add("drag");document.body.classList.add("resizing");
  const right=document.querySelector(".fbody").getBoundingClientRect().right;

});

/* delete = move the file into _回收站/ (two clicks) */
let delT;
function disarmDel(){clearTimeout(delT);const b=$("fdel");b.classList.remove("armed");b.textContent="移到回收站"}
$("fdel").onclick=async()=>{
  const b=$("fdel");
  if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="再点一次确认";delT=setTimeout(disarmDel,3000);return}
  disarmDel();
  const c=byId(openId);if(!c)return;
  clearTimeout(c.t);c.dirty=false;await c.q;
  try{
    const t=await dir.getDirectoryHandle(TRASH,{create:true});
    let n=c.file||fileNameFor(c),k=2;
    while(true){try{await t.getFileHandle(n);n=c.file.replace(/\.md$/i,"")+` ${k++}.md`}catch(e){break}}
    const h=await t.getFileHandle(n,{create:true}),w=await h.createWritable();await w.write(toMd(c));await w.close();
    if(c.file)await dir.removeEntry(c.file);
  }catch(err){setSave("移动失败："+err.message,true);return}
  const i=cards.indexOf(c);cards.splice(i,1);
  closeCardNow();renderBoard();saveProject();toast(`「${c.title||"未命名"}」已移到 ${TRASH}/`);
};

document.addEventListener("keydown",e=>{
  const k=(e.code||"").replace(/^Key/,"").toLowerCase()||(e.key||"").toLowerCase();
  if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&!e.altKey&&k==="s"){e.preventDefault();saveNow();return}
  if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&!e.altKey&&k==="f"&&!$("main").hidden){e.preventDefault();if(openId)closeCard();$("search").focus();$("search").select();return}
  if(e.key==="Escape"&&!$("cmenu").hidden){e.preventDefault();hideCmenu();return}
  if(e.key==="Escape"&&linkFrom){e.preventDefault();cancelLink();return}
  if((e.metaKey||e.ctrlKey)&&e.shiftKey&&!e.altKey&&e.key==="Enter"&&!$("main").hidden){e.preventDefault();setZen(!document.body.classList.contains("zen"));return}
  if(e.key==="Escape"&&document.body.classList.contains("zen")&&$("lbox").hidden&&$("ldlg").hidden){e.preventDefault();setZen(false);return}
  if(openId){
    if(e.key==="Escape"){e.preventDefault();if(!$("lbox").hidden)closeLbox();else closeCard()}
    else if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&!e.altKey&&k==="e"){e.preventDefault();setPreview(!previewOn)}
    else if((e.metaKey||e.ctrlKey)&&e.shiftKey&&!e.altKey&&k==="h"){e.preventDefault();toggleHL()}
    else if(e.altKey&&e.key==="ArrowLeft"){e.preventDefault();step(-1)}
    else if(e.altKey&&e.key==="ArrowRight"){e.preventDefault();step(1)}
  }else if((e.key==="Enter"||e.key===" ")&&e.target.classList?.contains("card")){e.preventDefault();e.target.click()}
});

/* ---------- board interactions ---------- */
let dragId=null,moved=false,droppedOut=false;
const grid=$("grid");
grid.addEventListener("click",e=>{
  if(lpFired){lpFired=false;return} /* the long press that opened the menu */
  if(linkClick(e))return;
  const t=e.target.closest(".tag[data-tag]");if(t){e.stopPropagation();toggleTagFilter(t.dataset.tag);return}
  const c=e.target.closest(".card");if(!c||moved)return;
  if(c.dataset.proj)jumpTo(c.dataset.proj,c.dataset.id);else openCard(c.dataset.id);
});
let dragWarned=false;
grid.addEventListener("dragstart",e=>{const c=e.target.closest(".card");if(!c)return;dragWarned=false;dragId=c.dataset.id;moved=false;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
grid.addEventListener("dragover",e=>{
  /* while a search is on, only part of the cards are shown, so reordering is off (dragging to a project still works) */
  if(!dragId||parseQuery(query).on)return;
  if(!manualSort()){if(!dragWarned&&e.target.closest(".card")){dragWarned=true;toast(`现在按「${SORTS[P.sort]}」排列，要拖动排序请先把排序切回「手动排序」`)}return}
  e.preventDefault();
  const over=e.target.closest(".card"),src=grid.querySelector(`[data-id="${dragId}"]`);
  if(!over||over===src)return;
  const r=over.getBoundingClientRect(),ref=e.clientX>r.left+r.width/2?over.nextSibling:over;
  if(ref!==src&&ref!==src.nextSibling){grid.insertBefore(src,ref);moved=true;linksSoon()}
});
grid.addEventListener("dragend",()=>{
  if(!dragId)return;
  $("plist").querySelectorAll(".drop").forEach(x=>x.classList.remove("drop"));
  if(droppedOut||parseQuery(query).on||!manualSort()){droppedOut=false;dragId=null;grid.querySelector(".dragging")?.classList.remove("dragging");setTimeout(()=>moved=false,0);return}
  const order=[...grid.querySelectorAll(".card")].map(n=>n.dataset.id);
  cards.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  dragId=null;renderBoard();if(moved)saveProject();setTimeout(()=>moved=false,0);
});
$("board").addEventListener("dblclick",e=>{if(e.target===$("board")||e.target===grid)addCard()});
function addCard(){
  if(!dir){$("newProj").hidden=false;$("newProjName").focus();return}
  const c={id:uid(),file:"",title:"新场景",status:"idea",pin:"blue",created:stamp(Date.now()),mtime:Date.now(),tags:[],links:[],hlnotes:[],synopsis:"",notes:"",drafts:"",body:""};
  c.file=fileNameFor(c);

/* ---------- links between cards (dashed lines on the board) ----------
   A link is stored in the front matter of the card it was drawn from:
     links: [{"to":"b7","dir":1,"note":"伏笔"},{"to":"k2","proj":"别的项目"}]
   dir 1 = this card → that card, -1 = that card → this card, no dir = no direction.
   proj = the other card's project folder, only when it lives in another project.
   A link shows on both cards. It can be changed from either card as long as the card that stores it is in the
   current project; a link stored in another project's card is shown read-only (other projects are never written). */
function normLinks(v){
  const out=[];if(!Array.isArray(v))return out;
  for(const x of v){
    if(!x||typeof x!=="object"||x.to==null||x.to==="")continue;
    const l={to:String(x.to)};
    if(x.proj)l.proj=String(x.proj);
    if(+x.dir===1||+x.dir===-1)l.dir=+x.dir;
    if(x.note!=null&&String(x.note).trim())l.note=String(x.note).replace(/\s+/g," ").trim();
    out.push(l);
  }
  return out;
}
/* where is card `id`? (the project hint first; a card that was moved away is still found by its id) */
function findCard(id,proj){
  const here=()=>{const c=byId(id);return c?{proj:curName,c,here:true}:null};
  const inProj=p=>{const g=gIndex.get(p),c=g&&g.cards.find(x=>x.id===id);return c?{proj:p,c}:null};
  if(!proj||proj===curName){const r=here();if(r)return r}
  else{const r=inProj(proj)||here();if(r)return r}
  for(const g of gIndex.values()){const c=g.cards.find(x=>x.id===id);if(c)return{proj:g.name,c}}
  return null;
}
const projTitle=name=>name===curName?(P&&P.title||name):(gIndex.get(name)?.title||projects.find(p=>p.name===name)?.title||name);
/* every link that touches card X: rel = direction seen from X (1 = X → other, -1 = other → X, 0 = none) */
function linkRows(X){
  const rows=[];if(!X)return rows;
  (X.links||[]).forEach(l=>rows.push({owner:X,l,other:findCard(l.to,l.proj),rel:l.dir||0,out:true,edit:true}));
  cards.forEach(c=>{if(c!==X)(c.links||[]).forEach(l=>{if(l.to===X.id&&(!l.proj||l.proj===curName))rows.push({owner:c,l,other:{proj:curName,c,here:true},rel:-(l.dir||0),out:false,edit:true})})});
  for(const g of gIndex.values())g.cards.forEach(c=>(c.links||[]).forEach(l=>{if(l.to===X.id&&l.proj===curName)rows.push({owner:c,ownerProj:g.name,l,other:{proj:g.name,c},rel:-(l.dir||0),out:false,edit:false})}));
  return rows;
}
const linked=(a,b,bProj)=>(a.links||[]).some(l=>l.to===b.id&&(l.proj||curName)===(bProj||curName))
  ||(b.links||[]).some(l=>l.to===a.id&&(l.proj||bProj||curName)===curName); /* b's links without proj point into b's own project */

/* --- the lines --- */
let linkRaf=0,hotId=null;
const linksSoon=()=>{cancelAnimationFrame(linkRaf);linkRaf=requestAnimationFrame(drawLinks)};
/* like string between two pins: from the pin on top of one card to the pin on the other, sagging a little */
function drawLinks(){
  const svg=$("links"),board=$("board");
  if(view!=="board"||board.hidden||!cards.length){svg.innerHTML="";return}
  const els=new Map();$("grid").querySelectorAll(".card:not(.ext)").forEach(e=>els.set(e.dataset.id,e));
  const br=board.getBoundingClientRect(),sx=board.scrollLeft,sy=board.scrollTop;
  const pin=e=>{const r=e.getBoundingClientRect();return[r.left-br.left+sx+r.width/2,r.top-br.top+sy+1]};
  const f=n=>n.toFixed(1);
  let out="";
  for(const c of cards){
    const ea=els.get(c.id);if(!ea||!c.links)continue;
    for(const l of c.links){
      if(l.proj&&l.proj!==curName&&!findCard(l.to,l.proj)?.here)continue; /* other project (unless that card has since been moved here) */
      const eb=els.get(l.to);if(!eb||eb===ea)continue;
      let[px,py]=pin(ea),[qx,qy]=pin(eb);if(l.dir===-1)[px,py,qx,qy]=[qx,qy,px,py];
      const len=Math.hypot(qx-px,qy-py)||1,ux=(qx-px)/len,uy=(qy-py)/len;
      let nx=-uy,ny=ux;if(ny<-.01||(Math.abs(ny)<=.01&&nx<0)){nx=-nx;ny=-ny}
      /* nearly vertical (e.g. the single column on the phone): bow out sideways, the longer the wider, so the arcs don't sit on top of each other */
      const sag=Math.abs(ux)<.35?Math.min(len*.3,board.clientWidth/2-24):Math.min(70,len*.16),cx=(px+qx)/2+nx*sag,cy=(py+qy)/2+ny*sag;
      let g=`<g class="lk" data-a="${esc(c.id)}" data-b="${esc(l.to)}"><path class="ls" d="M${f(px)} ${f(py)}Q${f(cx)} ${f(cy)} ${f(qx)} ${f(qy)}"/><circle cx="${f(px)}" cy="${f(py)}" r="3"/>`;
      if(l.dir){
        const tl=Math.hypot(qx-cx,qy-cy)||1,tx=(qx-cx)/tl,ty=(qy-cy)/tl,ex=qx-tx*4,ey=qy-ty*4,bx=ex-tx*10,by=ey-ty*10;
        g+=`<path class="la" d="M${f(ex)} ${f(ey)}L${f(bx-ty*4.5)} ${f(by+tx*4.5)}L${f(bx+ty*4.5)} ${f(by-tx*4.5)}Z"/>`;
      }else g+=`<circle cx="${f(qx)}" cy="${f(qy)}" r="3"/>`;
      if(l.note){const t=l.note.length>12?l.note.slice(0,11)+"…":l.note;g+=`<text x="${f(.25*px+.5*cx+.25*qx)}" y="${f(.25*py+.5*cy+.25*qy)}">${esc(t)}</text>`}
      out+=g+"</g>";
    }
  }
  svg.setAttribute("width",0);svg.setAttribute("height",0);
  svg.setAttribute("width",board.scrollWidth);svg.setAttribute("height",board.scrollHeight);
  svg.innerHTML=out;markHot();
}
function markHot(){
  const svg=$("links"),id=linkFrom||hotId;
  let any=false;
  svg.querySelectorAll(".lk").forEach(g=>{const on=!!id&&(g.dataset.a===id||g.dataset.b===id);g.classList.toggle("hot",on);any=any||on});
  svg.classList.toggle("hashot",any);
}

$("dup").onclick=()=>dbxBrowse(dcur.slice(0,dcur.lastIndexOf("/")));
$("duse").onclick=()=>{if(!dcur)return;dbxSave({root:dcur});openDbx(dcur)};
$("dout").onclick=()=>dbxLogout();
async function openDbx(path){
  try{$("dpick").hidden=true;await openWorkspace(new DbxDir(path))}
  catch(e){
    showWelcome();
    if(e.auth){dbxLogout();toast("Dropbox 登录已失效，请重新登录");return}
    toast("打不开 Dropbox 里的书房："+e.message);
    const b=$("dbxBtn");b.hidden=false;b.textContent="重试：打开 Dropbox 里的 "+path.split("/").pop();
  }
}
function dbxLogout(){
  if(DBX.refresh)dbx("auth/token/revoke",null).catch(()=>{});
  DBX.access=null;DBX.refresh=null;lsSet("carddesk.dbx",null);
  $("dpick").hidden=true;const b=$("dbxBtn");b.hidden=false;b.textContent="用 Dropbox 打开书房…";
  $("pick").hidden=!("showDirectoryPicker" in window);$("dkey").hidden=!!dbxKey();
}
$("dbxBtn").onclick=()=>{
  if(!DBX.refresh)return dbxLogin();
  const r=dbxSaved().root;if(r)openDbx(r);else dbxShowPicker("");
};
$("dkeyin").value=lsGet("carddesk.dbxkey")||"";
$("dkeyin").addEventListener("change",e=>lsSet("carddesk.dbxkey",e.target.value.trim()||null));

(async()=>{
  const canLocal="showDirectoryPicker" in window,canDbx=isSecureContext&&/^https?:$/.test(location.protocol);
  const s=$("support");
  $("pick").hidden=!canLocal;$("dbxBtn").hidden=!canDbx;
  if(!canLocal&&!canDbx){s.textContent="这个浏览器不能读写本地文件夹。请用 Chrome 或 Edge 打开这个文件。";s.classList.add("warn");return}
  if(canDbx)s.textContent=canLocal?"本地文件夹：直接读写这台电脑的硬盘。Dropbox：手机和电脑都能用，稿子只在你的浏览器和 Dropbox 之间传输，不经过其他服务器。"
    :"稿子只在你的浏览器和 Dropbox 之间传输，不经过其他服务器。";
  if(canDbx){
    const sv=dbxSaved();if(sv.refresh)DBX.refresh=sv.refresh;
    $("dkey").hidden=!!dbxKey();
    let back=false;
    try{back=await dbxFinishLogin()}catch(e){toast("Dropbox 登录没有完成："+e.message)}
    if(back){dbxShowPicker(sv.root||"");return}
    /* signed in before: open the 书房 straight away, so a reload on the phone lands back where you were */
    if(DBX.refresh&&sv.root){await openDbx(sv.root);return}
    if(DBX.refresh)$("dbxBtn").textContent="选 Dropbox 里的书房…";
  }
  if(!canLocal)return;
  const last=await idbGet("root")||await idbGet("last");
  if(last&&last.queryPermission){const b=$("resume");b.hidden=false;b.textContent="继续：打开 "+last.name;b.onclick=()=>resume(last)}
})();
/* the app passes back "?code=…&state=…" from the system sign-in window */
window.__appAuthBack=async search=>{
  try{if(await dbxFinishLogin(new URLSearchParams(search),true))dbxShowPicker(dbxSaved().root||"")}
  catch(e){toast("Dropbox 登录没有完成："+e.message)}
};
window.__carddesk={openProject,openWorkspace,flush:flushAll};
</script>
</body>
</html>
